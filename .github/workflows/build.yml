# M4 构建分发（DESIGN.md §4.1）：三平台矩阵，构建机零安装
name: build

permissions:
  contents: write

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest = arm64 runner（M2/M4 已验证平台）
          - os: macos-latest
            target: darwin-arm64
            upload: |
              # 注意：不含裸 .app（目录含数千文件，无法作 Release 资产），dmg/zip 已足够
              dist/*.zip
              dist/*.dmg
          # Windows x64（DESIGN.md §7 M4：macOS 先行，Windows 跟进）
          - os: windows-latest
            target: win32-x64
            upload: |
              shell/src-tauri/target/release/bundle/msi/*.msi
              shell/src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            shell/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('shell/src-tauri/Cargo.lock') }}

      - name: Install shell deps
        working-directory: shell
        run: npm install

      # M3: 组装 payload（Node LTS + npm 生产安装 + 校验 + manifest + 瘦身）
      - name: Assemble payload
        run: node scripts/assemble-payload.mjs --target ${{ matrix.target }}

      # 资源 glob 不支持 ../（glob crate 限制），用符号链接/目录联接指向 payload
      - name: Link payload into src-tauri (macOS)
        if: runner.os == 'macOS'
        run: ln -sfn ../../payload shell/src-tauri/payload

      - name: Link payload into src-tauri (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # junction 的 Target 必须是绝对路径（PowerShell 限制）
          Remove-Item shell/src-tauri/payload -Force -Recurse -ErrorAction SilentlyContinue
          $target = Join-Path $env:GITHUB_WORKSPACE "payload"
          New-Item -ItemType Junction -Path shell/src-tauri/payload -Target $target | Out-Null
          # 校验
          if (-not (Test-Path shell/src-tauri/payload/app/node_modules/@deepseek-ai/dsh/lib/bin.js)) {
            throw "junction 校验失败: bin.js 不可达"
          }

      # M2+M4: 合并构建（release .app / .msi / .exe）
      - name: Tauri build
        working-directory: shell
        run: npx tauri build

      # macOS 附加产物：.app.zip + .dmg（hdiutil 无头方案，规避 create-dmg/Finder 自动化）
      - name: Package macOS artifacts
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          cd shell/src-tauri/target/release/bundle/macos
          zip -rqy "$GITHUB_WORKSPACE/dist/DSH-Desktop_${{ github.ref_name }}_aarch64.app.zip" "DSH Desktop.app"
          bash "$GITHUB_WORKSPACE/scripts/make-dmg.sh" ${{ github.ref_name }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-${{ matrix.target }}-${{ github.ref_name }}
          path: ${{ matrix.upload }}
          if-no-files-found: warn
  # 发布：tag 触发时把双平台安装包发布到 GitHub Releases（DESIGN.md §4.3 分发产物）
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.msi
            artifacts/**/*.exe
          generate_release_notes: true
          draft: false
          prerelease: false