# M4 构建分发（DESIGN.md §4.1）：三平台矩阵，构建机零安装
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest = arm64 runner
          - os: macos-latest
            target: darwin-arm64
            artifact: dmg
          # Windows x64（后续跟进，见 DESIGN.md §7 M4）
          - os: windows-latest
            target: win32-x64
            artifact: msi
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # macOS: Tauri 依赖 Xcode CLT（runner 自带）；Windows: MSVC（runner 自带）
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            shell/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('shell/src-tauri/Cargo.lock') }}

      - name: Install shell deps
        working-directory: shell
        run: npm install

      # M3: 组装 payload（Node LTS + npm 生产安装 + 校验 + manifest + 瘦身）
      - name: Assemble payload
        run: node scripts/assemble-payload.mjs --target ${{ matrix.target }}

      # M2+M4: 合并构建
      - name: Tauri build
        working-directory: shell
        env:
          DSH_DESKTOP_NODE: ${{ github.workspace }}/payload/node/bin/node$(if('${{ runner.os }}' -eq 'Windows'){'.exe'})
        run: npx tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-${{ matrix.target }}
          path: |
            shell/src-tauri/target/release/bundle/dmg/*.dmg
            shell/src-tauri/target/release/bundle/msi/*.msi
            shell/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
