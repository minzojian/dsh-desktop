[package]
name = "dsh-desktop"
version = "0.1.0"
description = "DSH 桌面版（Tauri v2 壳）"
edition = "2021"
license = "MIT"

[lib]
name = "dsh_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
signal-hook = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true